<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BTC Trading System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-bg: #ffffff;
            --bs-body-color: #000000;
            --bs-card-bg: #ffffff;
            --bs-border-color: #dee2e6;
        }
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            font-size: 14px;
        }
        .navbar {
            background-color: #000000 !important;
        }
        .navbar-brand, .nav-link {
            color: #ffffff !important;
        }
        .nav-link:hover {
            color: #cccccc !important;
        }
        .card {
            background-color: var(--bs-card-bg);
            border: 1px solid var(--bs-border-color);
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid var(--bs-border-color);
            font-weight: bold;
        }
        .table {
            color: var(--bs-body-color);
            font-size: 14px;
        }
        .text-success { color: #28a745 !important; }
        .text-danger { color: #dc3545 !important; }
        .text-warning { color: #fd7e14 !important; }
        .text-muted { color: #6c757d !important; }
        .metric-value {
            font-size: 14px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .metric-value-lg {
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .metric-label {
            font-size: 11px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 500;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-active { background-color: #28a745; }
        .status-inactive { background-color: #6c757d; }
        .status-warning { background-color: #fd7e14; }
        .spread-positive { color: #28a745; }
        .spread-negative { color: #dc3545; }
        .form-range {
            width: 100%;
        }
        .form-check-input:checked {
            background-color: #000000;
            border-color: #000000;
        }
        .badge {
            font-size: 12px;
        }
        .btn-sm {
            font-size: 12px;
        }
        .table th {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6c757d;
        }
        .expiry-warning {
            background-color: #fff3cd !important;
        }
        .expiry-danger {
            background-color: #f8d7da !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                BTC Basis Trading
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/positions' %}active{% endif %}" href="/positions">Positions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/trades' %}active{% endif %}" href="/trades">Trades</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/settings/' %}active{% endif %}" href="/settings/">Settings</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-warning text-dark me-2" id="mode-badge">PAPER</span>
                    <span class="status-indicator status-active"></span>
                    <span class="text-light small">Connected</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function formatPrice(price) {
            return '$' + Number(price).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function formatPercent(value) {
            return (value * 100).toFixed(4) + '%';
        }

        function formatBasisPercent(value) {
            const pct = (value * 100).toFixed(3);
            if (value >= 0) {
                return '<span class="text-success">+' + pct + '%</span>';
            }
            return '<span class="text-danger">' + pct + '%</span>';
        }

        function formatPnL(value) {
            const formatted = '$' + Math.abs(value).toFixed(2);
            if (value >= 0) {
                return '<span class="text-success">+' + formatted + '</span>';
            }
            return '<span class="text-danger">-' + formatted + '</span>';
        }

        function formatZScore(value) {
            const formatted = value.toFixed(2);
            if (value >= 2) {
                return '<span class="text-success">' + formatted + '</span>';
            } else if (value <= -2) {
                return '<span class="text-danger">' + formatted + '</span>';
            }
            return formatted;
        }

        function formatSpread(value) {
            const formatted = '$' + Math.abs(value).toFixed(2);
            if (value >= 0) {
                return '<span class="text-success">+' + formatted + '</span>';
            }
            return '<span class="text-danger">-' + formatted + '</span>';
        }

        function startAutoRefresh(callback, interval = 1000) {
            callback();
            setInterval(callback, interval);
        }

        // Calculate days until expiry
        function daysUntil(dateStr) {
            const expiry = new Date(dateStr);
            const now = new Date();
            const diff = expiry - now;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
