<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BTC Trading System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-bg: #1a1a2e;
            --bs-body-color: #eaeaea;
            --bs-card-bg: #16213e;
            --bs-border-color: #0f3460;
        }
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        .card {
            background-color: var(--bs-card-bg);
            border-color: var(--bs-border-color);
        }
        .table {
            color: var(--bs-body-color);
        }
        .text-success { color: #00ff88 !important; }
        .text-danger { color: #ff4757 !important; }
        .text-warning { color: #ffa502 !important; }
        .bg-success-subtle { background-color: rgba(0, 255, 136, 0.1) !important; }
        .bg-danger-subtle { background-color: rgba(255, 71, 87, 0.1) !important; }
        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        .metric-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-active { background-color: #00ff88; }
        .status-inactive { background-color: #666; }
        .status-warning { background-color: #ffa502; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-currency-bitcoin"></i> BTC Arb System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/positions' %}active{% endif %}" href="/positions">
                            <i class="bi bi-wallet2"></i> Positions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/trades' %}active{% endif %}" href="/trades">
                            <i class="bi bi-journal-text"></i> Trades
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/signals' %}active{% endif %}" href="/signals">
                            <i class="bi bi-graph-up"></i> Signals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/settings/' %}active{% endif %}" href="/settings/">
                            <i class="bi bi-gear"></i> Settings
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="badge bg-warning text-dark me-2" id="mode-badge">PAPER</span>
                    <span class="status-indicator status-active"></span>
                    <span class="text-light small">Connected</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Utility functions
        function formatPrice(price) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(price);
        }

        function formatPercent(value) {
            return (value * 100).toFixed(4) + '%';
        }

        function formatPnL(value) {
            const formatted = formatPrice(Math.abs(value));
            if (value >= 0) {
                return '<span class="text-success">+' + formatted + '</span>';
            }
            return '<span class="text-danger">-' + formatted + '</span>';
        }

        function formatZScore(value) {
            const cls = Math.abs(value) >= 2 ? 'text-warning' : '';
            return '<span class="' + cls + '">' + value.toFixed(2) + '</span>';
        }

        // Auto-refresh data
        function startAutoRefresh(callback, interval = 1000) {
            callback();
            setInterval(callback, interval);
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
